<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulare</title></head>
<body>
<!-- Nur für die Formular-Erkennung von Netlify. Das sichtbare Formular sitzt im Anfrage-Dialog des Shops. -->
<form name="anfrage" method="post" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="anfrage">
  <input name="anliegen"><input name="werk"><input name="seite">
  <input name="name"><input name="email" type="email"><input name="telefon">
  <textarea name="nachricht"></textarea>
  <input type="checkbox" name="datenschutz" value="ja">
  <input name="bot-field">
</form>
<p>Vielen Dank, Ihre Anfrage ist angekommen. <a href="/">Zurück zum Shop</a></p>
</body></html>
